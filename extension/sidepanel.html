<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decode the Noise</title>
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<main>
  <div class="top">Decode the Noise</div>

  <div class="tabbar">
    <span id="tab-hint">Open a Bluesky post or a YouTube video.</span>
    <button class="go" id="tab-go" type="button" disabled>Analyse this tab</button>
  </div>

  <form class="compose" id="form">
    <div class="compose-body">
      <label for="in" hidden>Post link, video link or text</label>
      <textarea id="in" rows="2" placeholder="Or paste a link or text here"></textarea>
      <div class="compose-row">
        <span class="count" id="count" aria-live="off"></span>
        <button class="go" id="go" type="submit" disabled>Analyze</button>
      </div>
    </div>
  </form>

  <div class="status" id="status" role="status" aria-live="polite">
    Open a Bluesky post or a YouTube video and press "Analyse this tab". On any other site, select text, right-click and choose "Decode this text".
  </div>

  <div id="result" hidden>
    <section id="post"></section>
    <section id="tech"></section>
    <section class="card side" id="bot" hidden></section>
    <section class="card side" id="sim" hidden></section>
    <section class="card side" id="cov" hidden></section>
    <section id="thread" hidden>
      <h2 class="sec-title" id="thread-title">Replies</h2>
      <div id="replies"></div>
      <div class="status" id="more" role="status" aria-live="polite"></div>
    </section>
  </div>
</main>

<script src="config.js"></script>
<script src="panel.js"></script>
<script src="app.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
