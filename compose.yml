# The VPS template already runs Traefik on ports 80/443 (letsencrypt resolver), so no Caddy here.
services:
  app:
    # git context so the same file also works when pasted into the Hostinger Docker manager
    build:
      context: https://github.com/vietdoan0233/Da-Vinci-s-Hostinger-Challenge.git#main
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      AI_ROUTER_API_KEY: ${AI_ROUTER_API_KEY:-}
      AI_ROUTER_BASE_URL: ${AI_ROUTER_BASE_URL:-}
      AI_ROUTER_MODEL: ${AI_ROUTER_MODEL:-}
      OXYLABS_WEB_API_KEY: ${OXYLABS_WEB_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.decode.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.decode.entrypoints=websecure
      - traefik.http.routers.decode.tls.certresolver=letsencrypt
      - traefik.http.services.decode.loadbalancer.server.port=8000
