services:
  app:
    build: .
    restart: unless-stopped
    ports: ["80:8000"]
    volumes:
      - ./models:/code/models:ro
      - ./cache:/code/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
